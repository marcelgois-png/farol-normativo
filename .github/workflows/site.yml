name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m farol validar
      - run: python -m farol gerar
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    # O GitHub Pages do plano gratuito só existe em repositório público.
    # Enquanto o repositório for privado, só o job "build" roda (testes,
    # validação e geração); o site gerado fica disponível como artefato da execução.
    if: ${{ github.event.repository.private == false }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
