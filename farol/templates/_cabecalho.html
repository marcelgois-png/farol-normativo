{# Barra de título do Farol, presente em todas as páginas (inclusive na Teia): marca UFPB na aplicação preferencial + nome do sistema + seções. #}
<div class="stripe" aria-hidden="true"></div>
<header class="top"><div class="in">
  <a class="brand" href="{{ raiz }}">
    <span class="marca"><img src="{{ raiz }}assets/ufpb-lockup.png" alt="UFPB — Universidade Federal da Paraíba" width="342" height="180"></span>
    <span class="sep" aria-hidden="true"></span>
    <span class="nome"><b>Farol Normativo</b><small>atualizado em {{ meta.data_base_br }}</small></span>
  </a>
  <nav class="menu" aria-label="Seções">
    <a href="{{ raiz }}busca/" {% if secao=='busca' %}class="on"{% endif %}>Busca</a>
    <a href="{{ raiz }}teia/" {% if secao=='teia' %}class="on"{% endif %}>Teia</a>
    <a href="{{ raiz }}estrutura/" {% if secao=='estrutura' %}class="on"{% endif %}>Estatuto e regimentos</a>
    <a href="{{ raiz }}vigencia/" {% if secao=='vigencia' %}class="on"{% endif %}>Vigência</a>
    <a href="{{ raiz }}divergencias/" {% if secao=='divergencias' %}class="on"{% endif %}>Divergências</a>
    <a href="{{ raiz }}fila/" {% if secao=='fila' %}class="on"{% endif %}>Fila</a>
    <a href="{{ raiz }}sobre/" {% if secao=='sobre' %}class="on"{% endif %}>Sobre</a>
  </nav>
  <button class="tema" id="btnTema" type="button" aria-label="Alternar entre tema claro e escuro" title="Tema claro ou escuro">
    <svg class="lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
    <svg class="sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
  </button>
</div></header>
<script>(function(){var b=document.getElementById('btnTema');if(!b)return;var h=document.documentElement;function atual(){var t=h.getAttribute('data-theme');if(t==='dark'||t==='light')return t;return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
b.addEventListener('click',function(){var novo=atual()==='dark'?'light':'dark';h.setAttribute('data-theme',novo);try{localStorage.setItem('farol-tema',novo);}catch(e){}});})();</script>
